project:
  name: "KoTon"
  seed: 42

scenarios:
  enabled:
    - "fox"
    - "russellmitchell"
    - "harrison"
    - "santos"
    - "shaw"
    - "wardbeck"
    - "wilson"
  excluded:
    - "wheeler"
  default_scenario: "fox"

paths:
  data_dir: "data"
  processed_dir: "processed"
  artifacts_dir: "artifacts"
  checkpoints_dir: "checkpoints"

parser:
  chunk_size: 8000
  carryover_sec: 2.0
  include_supplementary_logs: true
  apache_dirb_sample_stride: 20
  dnsmasq_benign_sample_stride: 10

graph:
  window_size_sec: 180.0
  window_stride_sec: 60.0
  cpr_delta_t_sec: 1.0
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

features:
  process_dim: 68
  process_exe_hfh_dim: 16
  process_cmd_emb_dim: 48
  process_struct_dim: 4
  file_dim: 36
  file_path_hfh_dim: 32
  file_struct_dim: 4
  socket_dim: 20
  socket_ip_hfh_dim: 12
  socket_port_dim: 4
  socket_struct_dim: 4
  edge_attr_dim: 2
  fasttext_min_count: 1
  fasttext_window: 5
  fasttext_epochs: 10
  sensitive_prefixes:
    - "/etc"
    - "/root"
    - "/var/www"
    - "/tmp"
    - "/var/spool/cron"
    - "/usr/bin/sudo"
    - "/bin/su"

model:
  hidden_dim: 128
  num_layers: 2
  gat_heads: 4
  gat_out_channels: 32
  edge_dim: 2
  num_classes: 6
  dropout: 0.1
  mask_rate: 0.5
  sce_gamma: 3.0
  focal_gamma: 2.0
  cls_loss_weight: 1.0
  learning_rate: 0.002
  weight_decay: 0.0001
  anomaly_threshold_quantile: 0.95
